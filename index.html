<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>つかまえて！ミニゲーム</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap');

  :root {
    --bg: #1a0a2e;
    --bg2: #2d1155;
    --accent1: #ff6eb4;
    --accent2: #c084fc;
    --accent3: #fbbf24;
    --text: #fde8f5;
    --panel: rgba(45, 17, 85, 0.85);
    --success: #4ade80;
    --fail: #f87171;
    --glow: 0 0 18px rgba(255,110,180,0.6);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Zen Maru Gothic', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
    user-select: none;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(192,132,252,0.18) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 80%, rgba(255,110,180,0.15) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  /* === TITLE SCREEN === */
  #title-screen {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    background: var(--bg);
    gap: 28px;
  }

  .title-deco {
    font-size: 3.5rem;
    letter-spacing: 0.1em;
    font-weight: 900;
    background: linear-gradient(135deg, var(--accent1), var(--accent2), var(--accent3));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-align: center;
    line-height: 1.2;
    text-shadow: none;
    filter: drop-shadow(0 0 12px rgba(255,110,180,0.5));
  }

  .title-sub {
    font-size: 1rem;
    color: var(--accent2);
    letter-spacing: 0.2em;
  }

  .hearts-deco {
    font-size: 2rem;
    animation: float 2s ease-in-out infinite alternate;
  }

  @keyframes float {
    from { transform: translateY(-6px); }
    to   { transform: translateY(6px); }
  }

  .start-btn {
    margin-top: 12px;
    padding: 14px 52px;
    background: linear-gradient(135deg, var(--accent1), var(--accent2));
    border: none;
    border-radius: 50px;
    font-family: inherit;
    font-size: 1.2rem;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    box-shadow: var(--glow);
    transition: transform 0.15s, box-shadow 0.15s;
    letter-spacing: 0.1em;
  }

  .start-btn:hover {
    transform: scale(1.07);
    box-shadow: 0 0 30px rgba(255,110,180,0.8);
  }

  .how-to {
    font-size: 0.85rem;
    color: var(--accent2);
    opacity: 0.75;
    text-align: center;
    line-height: 1.8;
  }

  /* === GAME WRAPPER === */
  #game-wrapper {
    display: none;
    flex-direction: column;
    align-items: center;
    width: 100%;
    height: 100vh;
    position: relative;
    z-index: 1;
  }

  /* === HUD === */
  #hud {
    width: 100%;
    max-width: 480px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 24px 0;
    gap: 12px;
  }

  .hud-box {
    background: var(--panel);
    border: 1px solid rgba(192,132,252,0.3);
    border-radius: 16px;
    padding: 8px 18px;
    font-size: 0.95rem;
    backdrop-filter: blur(8px);
  }

  .hud-box span {
    color: var(--accent3);
    font-weight: 900;
    font-size: 1.2rem;
  }

  /* heart indicators */
  #hearts-bar {
    display: flex;
    gap: 4px;
    font-size: 1.4rem;
  }

  .heart { transition: filter 0.3s; }
  .heart.lost { filter: grayscale(1) opacity(0.35); }

  /* streak hidden indicator */
  #streak-bar {
    display: flex;
    gap: 3px;
    font-size: 1rem;
    opacity: 0;
    transition: opacity 0.4s;
  }
  .skull { filter: grayscale(1) opacity(0.3); }  /* 未点灯：薄くグレー */
  .skull.lit { filter: none; }                    /* 点灯：フルカラー */

  /* === GAME CANVAS AREA === */
  #game-area {
    position: relative;
    width: 100%;
    max-width: 480px;
    flex: 1;
    overflow: hidden;
    margin-top: 10px;
  }

  /* lane guides (subtle) */
  #game-area::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      repeating-linear-gradient(90deg,
        transparent,
        transparent calc(100% / 3 - 1px),
        rgba(192,132,252,0.06) calc(100% / 3 - 1px),
        rgba(192,132,252,0.06) calc(100% / 3)
      );
    pointer-events: none;
  }

  /* === CHARACTERS === */
  #uke {
    position: absolute;
    top: 18px;
    filter: drop-shadow(0 0 8px rgba(255,110,180,0.7));
    z-index: 6;
    pointer-events: none;
  }

  #uke.falling {
    transition: top 0.6s cubic-bezier(.2,.8,.4,1) !important;
  }

  #seme {
    position: absolute;
    bottom: 24px;
    font-size: 3.5rem;
    transition: left 0.08s linear;
    filter: drop-shadow(0 0 8px rgba(192,132,252,0.7));
    z-index: 5;
    pointer-events: none;
  }

  /* === PROGRESS TRACK (top) === */
  #progress-track {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: rgba(255,255,255,0.08);
  }

  #progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent1), var(--accent2));
    width: 100%;
    transform-origin: left;
    transition: transform 0.1s linear;
  }

  /* === PARTICLES === */
  .particle {
    position: absolute;
    pointer-events: none;
    font-size: 1.4rem;
    animation: particle-fly 0.9s ease-out forwards;
    z-index: 20;
  }
  @keyframes particle-fly {
    0%   { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0.3); opacity: 0; }
  }

  /* === RESULT OVERLAY === */
  #result-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 200;
    background: rgba(10,4,20,0.92);
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    backdrop-filter: blur(6px);
    animation: overlay-in 0.35s ease;
  }
  #result-overlay.show { display: flex; }

  @keyframes overlay-in {
    from { opacity: 0; transform: scale(0.95); }
    to   { opacity: 1; transform: scale(1); }
  }

  .result-illust {
    font-size: 6rem;
    animation: pop-in 0.5s cubic-bezier(.2,1.5,.5,1);
    line-height: 1;
  }

  @keyframes pop-in {
    from { transform: scale(0) rotate(-15deg); opacity: 0; }
    to   { transform: scale(1) rotate(0deg); opacity: 1; }
  }

  .result-title {
    font-size: 2rem;
    font-weight: 900;
    letter-spacing: 0.08em;
    text-align: center;
  }

  .result-sub {
    font-size: 1rem;
    color: var(--accent2);
    text-align: center;
    line-height: 1.7;
    white-space: pre-line;
  }

  .result-btn {
    padding: 12px 44px;
    border-radius: 50px;
    border: none;
    font-family: inherit;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.08em;
    transition: transform 0.15s, box-shadow 0.15s;
  }

  .result-btn.continue {
    background: linear-gradient(135deg, var(--accent1), var(--accent2));
    color: #fff;
    box-shadow: var(--glow);
  }

  .result-btn.restart {
    background: rgba(255,255,255,0.1);
    color: var(--text);
    border: 1px solid rgba(192,132,252,0.4);
  }

  .result-btn:hover { transform: scale(1.06); }

  /* === CATCH FLASH === */
  #catch-flash {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 150;
    opacity: 0;
    transition: opacity 0.1s;
  }
  #catch-flash.flash-success { background: rgba(74,222,128,0.18); opacity: 1; }
  #catch-flash.flash-fail    { background: rgba(248,113,113,0.18); opacity: 1; }

  /* === COMBO BADGE === */
  #combo-badge {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-size: 2rem;
    font-weight: 900;
    color: var(--accent3);
    text-shadow: 0 0 16px rgba(251,191,36,0.8);
    pointer-events: none;
    z-index: 30;
    white-space: nowrap;
    transition: transform 0.25s cubic-bezier(.2,1.5,.5,1), opacity 0.3s;
    opacity: 0;
  }
  #combo-badge.show {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
  }

  /* === MOUSE/TOUCH HINT === */
  #control-hint {
    width: 100%;
    max-width: 480px;
    text-align: center;
    padding: 8px 24px 18px;
    font-size: 0.82rem;
    color: var(--accent2);
    opacity: 0.7;
    letter-spacing: 0.05em;
  }

  /* Cursor follower line */
  #cursor-line {
    position: absolute;
    bottom: 24px;
    left: 0;
    width: 2px;
    height: 18px;
    background: linear-gradient(to bottom, var(--accent1), transparent);
    pointer-events: none;
    opacity: 0.5;
    transition: left 0.05s linear;
    border-radius: 2px;
  }

  /* === STARS BG === */
  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }
  .star {
    position: absolute;
    border-radius: 50%;
    background: #fff;
    opacity: 0.45;
    animation: twinkle var(--dur) ease-in-out infinite alternate;
  }
  @keyframes twinkle {
    from { opacity: 0.15; transform: scale(0.8); }
    to   { opacity: 0.6;  transform: scale(1.2); }
  }
</style>
</head>
<body>

<!-- Stars background -->
<div class="stars" id="stars-bg"></div>

<!-- ===================== TITLE SCREEN ===================== -->
<div id="title-screen">
  <div class="hearts-deco">💜✨💜</div>
  <div class="title-deco">つかまえて！</div>
  <div class="title-sub">― キャッチ・ラブ ―</div>
  <div class="how-to">
    マウスを動かす・画面をなぞって <strong>アスラン</strong> を操作して<br>
    落ちてくる <strong>キラ</strong> をキャッチしよう！<br>
    5回連続成功でクリア 💕<br>
    もしキラをキャッチできなかったら……？<br>
    present by　魚海・G・ゆる　※敬称略
  </div>
  <button class="start-btn" id="start-btn">スタート ▶</button>
</div>

<!-- ===================== GAME ===================== -->
<div id="game-wrapper">
  <!-- HUD -->
  <div id="hud">
    <div class="hud-box">成功 <span id="score-disp">0</span> / 5</div>
    <div id="hearts-bar"></div>
    <div id="streak-bar"></div>
  </div>

  <!-- Game area -->
  <div id="game-area">
    <div id="progress-track"><div id="progress-bar"></div></div>

    <!-- 受け (uke) character -->
    <div id="uke"><img src="kira_mini.png" style="width:60px;height:auto"></div>

    <!-- 攻め (seme) character -->
    <div id="seme"><img src="athrun_mini.png" style="width:60px;height:auto"></div>

    <div id="cursor-line"></div>

    <!-- Combo badge -->
    <div id="combo-badge"></div>
  </div>

  <!-- Mobile/Mouse hint -->
  <div id="control-hint">マウスを動かす・画面をなぞって攻めを操作 💜</div>
</div>

<!-- ===================== RESULT OVERLAY ===================== -->
<div id="result-overlay">
  <div class="result-illust" id="result-illust"></div>
  <div class="result-title" id="result-title"></div>
  <div class="result-sub" id="result-sub"></div>
  <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;">
    <button class="result-btn continue" id="result-continue" style="display:none">続ける ▶</button>
    <button class="result-btn restart" id="result-restart">最初から ↺</button>
  </div>
</div>

<!-- Flash layer -->
<div id="catch-flash"></div>


<script>
/* ============================================================
   🌸 キャラクター・イラスト設定
   ============================================================ */
const UKE_CHAR  = '<img src="kira_mini.png" style="width:60px;height:auto">';
const SEME_CHAR = '<img src="athrun_mini.png" style="width:60px;height:auto">';

const ILLUSTS = {
  success1:    { emoji: '<img src="1080f01.png" style="max-width:90vw;height:auto;">', title: '成功！', sub: '「…捕まえた」\n…！離してっ!' },
  success3:    { emoji: '<img src="yurusan.png" style="max-width:90vw;height:auto;">', title: '3回目の成功！', sub: '「逃がさないって言っただろ？」\n逃げるキラが悪いんだ' },
  success5:    { emoji: '<img src="gsan.png" style="max-width:90vw;height:auto;">', title: 'クリア！✨', sub: '「もう離さない」\n ゲームクリア！お誕生日おめでとう！ 🎉' },
  fail1:       { emoji: '<img src="miss_01.png" style="max-width:90vw;height:auto;">', title: '失敗…', sub: '「…間に合わなかった」\nお仕置きが必要かな？' },
  fail5streak: { emoji: '<img src="miss_02.png" style="max-width:90vw;height:auto;">', title: '【隠し】5連続失敗！', sub: '「…もしかして、わざと？」\nまさかのシナリオ展開…！💊' },
};

/* ============================================================
   ゲーム設定
   ============================================================ */
const CONFIG = {
  MOVE_INTERVAL: 100,   // 受けが横移動する間隔(ms)
  FALL_HOLD:     2200,  // 横移動してから何ms後に落下開始
  FALL_DURATION: 700,  // 落下アニメーション時間(ms)
  SEME_SPEED:     7,    // 攻めの移動速度(px/frame)
  MAX_SUCCESS:    5,    // 最大成功回数
  MAX_MISS:       5,    // 失敗で使うハートの数
  CATCH_MARGIN:   60,   // キャッチ判定の横マージン(px)
  CATCH_MARGIN_V: 40,   // キャッチ判定の縦マージン(px)

  // ★ ウロウロ設定（ここで調整できます）
  WANDER_INTERVAL: 800, // 何ms間隔でウロウロ移動するか（大きいほどゆっくり）
  WANDER_RANGE:    150, // 一回の移動で最大何px動くか（大きいほど大きく動く）
  WANDER_SPEED:   '0.6s', // 移動アニメーションの速さ（大きいほどゆったり）
};

/* ============================================================
   状態変数
   ============================================================ */
let score       = 0;
let missCount   = 0;
let failStreak  = 0;
let gameRunning = false;
let ukeFalling  = false;
let ukeX        = 0;
let semeX       = 0;
let moveTimer   = null;
let fallTimer   = null;
let wanderTimer = null; // ★ ウロウロ用タイマー
let animFrame   = null;
let progressStart = 0;

/* ============================================================
   DOM refs
   ============================================================ */
const titleScreen   = document.getElementById('title-screen');
const gameWrapper   = document.getElementById('game-wrapper');
const ukeEl         = document.getElementById('uke');
const semeEl        = document.getElementById('seme');
const gameArea      = document.getElementById('game-area');
const progressBar   = document.getElementById('progress-bar');
const scoreDisp     = document.getElementById('score-disp');
const heartsBar     = document.getElementById('hearts-bar');
const streakBar     = document.getElementById('streak-bar');
const resultOverlay = document.getElementById('result-overlay');
const resultIllust  = document.getElementById('result-illust');
const resultTitle   = document.getElementById('result-title');
const resultSub     = document.getElementById('result-sub');
const resultContinue= document.getElementById('result-continue');
const resultRestart = document.getElementById('result-restart');
const comboBadge    = document.getElementById('combo-badge');
const catchFlash    = document.getElementById('catch-flash');

/* ============================================================
   Stars background
   ============================================================ */
(function makeStars() {
  const bg = document.getElementById('stars-bg');
  for (let i = 0; i < 60; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 3 + 1;
    s.style.cssText = `
      width:${size}px; height:${size}px;
      left:${Math.random()*100}%;
      top:${Math.random()*100}%;
      --dur:${(Math.random()*2+1.5).toFixed(1)}s;
      animation-delay:${(Math.random()*2).toFixed(1)}s;
    `;
    bg.appendChild(s);
  }
})();

/* ============================================================
   HUD helpers
   ============================================================ */
function buildHeartsBar() {
  heartsBar.innerHTML = '';
  for (let i = 0; i < CONFIG.MAX_MISS; i++) {
    const h = document.createElement('span');
    h.className = 'heart';
    h.textContent = '💜';
    heartsBar.appendChild(h);
  }
}

function updateHeartsBar() {
  const hearts = heartsBar.querySelectorAll('.heart');
  hearts.forEach((h, i) => {
    h.classList.toggle('lost', i >= CONFIG.MAX_MISS - missCount);
  });
}

function buildStreakBar() {
  streakBar.innerHTML = '';
  for (let i = 0; i < 5; i++) {
    const s = document.createElement('span');
    s.className = 'skull';
    s.textContent = '💀';
    streakBar.appendChild(s);
  }
}

function updateStreakBar() {
  const skulls = streakBar.querySelectorAll('.skull');
  streakBar.style.opacity = failStreak > 0 ? '1' : '0';
  skulls.forEach((s, i) => {
    s.classList.toggle('lit', i < failStreak);
  });
}

/* ============================================================
   Game area dimensions
   ============================================================ */
function areaWidth()  { return gameArea.clientWidth; }
function areaHeight() { return gameArea.clientHeight; }
const CHAR_W = 52;

/* ============================================================
   Position helpers
   ============================================================ */
function setUkeX(x) {
  ukeX = Math.max(0, Math.min(areaWidth() - CHAR_W, x));
  ukeEl.style.left = ukeX + 'px';
}

function setSemeX(x) {
  semeX = Math.max(0, Math.min(areaWidth() - CHAR_W, x));
  semeEl.style.left = semeX + 'px';
}

/* ============================================================
   ★ ウロウロ移動
   落下前に受けが左右にふらふら動く
   ============================================================ */
function startWandering() {
  if (!gameRunning || ukeFalling) return;

  // 現在位置から少しずらした位置にゆっくり移動
  const offset = (Math.random() - 0.5) * 2 * CONFIG.WANDER_RANGE;
  const newX = ukeX + offset;
  ukeEl.style.transition = `left ${CONFIG.WANDER_SPEED} ease-in-out`;
  setUkeX(newX);

  wanderTimer = setTimeout(startWandering, CONFIG.WANDER_INTERVAL);
}

function stopWandering() {
  clearTimeout(wanderTimer);
  wanderTimer = null;
}

/* ============================================================
   Uke movement cycle
   ============================================================ */
function scheduleUkeMove() {
  if (!gameRunning) return;
  stopWandering();
  clearTimeout(fallTimer);

  // 受けを上部にリセット
  ukeFalling = false;
  ukeEl.classList.remove('falling');
  ukeEl.style.top = '18px';

  // ランダムな初期位置にワープ（transition一時オフ）
  ukeEl.style.transition = 'none';
  const startX = Math.random() * (areaWidth() - CHAR_W);
  setUkeX(startX);

  // ウロウロ開始
  setTimeout(() => {
    startWandering();
  }, 50);

  // プログレスバー
  progressStart = Date.now();
  updateProgress();

  // FALL_HOLD ms後に落下
  fallTimer = setTimeout(() => {
    if (!gameRunning) return;
    startUkeFall();
  }, CONFIG.FALL_HOLD);
}

function updateProgress() {
  if (!gameRunning) return;
  const elapsed = Date.now() - progressStart;
  const ratio = 1 - Math.min(elapsed / CONFIG.FALL_HOLD, 1);
  progressBar.style.transform = `scaleX(${ratio})`;
  if (ratio > 0) requestAnimationFrame(updateProgress);
}

function startUkeFall() {
  stopWandering();
  ukeFalling = true;
  ukeEl.classList.add('falling');
  ukeEl.style.transition = `top ${CONFIG.FALL_DURATION}ms cubic-bezier(.2,.8,.4,1)`;
  const fallTarget = areaHeight() - 100;
  ukeEl.style.top = fallTarget + 'px';

  fallTimer = setTimeout(() => {
    if (!gameRunning) return;
    checkCatch();
  }, CONFIG.FALL_DURATION);
}

/* ============================================================
   Catch check
   ============================================================ */
function checkCatch() {
  ukeFalling = false;
  const ukeBottom = parseInt(ukeEl.style.top || 18) + CHAR_W;
  const semeTop   = areaHeight() - 24 - CHAR_W / 2;  // ← ここだけ変更
  const vertOK    = Math.abs(ukeBottom - semeTop) < CONFIG.CATCH_MARGIN_V;
  const horizOK   = Math.abs(ukeX - semeX) < CONFIG.CATCH_MARGIN;

  if (vertOK && horizOK) {
    onSuccess();
  } else {
    onMiss();
  }
}

/* ============================================================
   Success
   ============================================================ */
function onSuccess() {
  score++;
  failStreak = 0;
  scoreDisp.textContent = score;
  updateStreakBar();

  flashScreen('success');
  spawnParticles(ukeX, parseInt(ukeEl.style.top), ['💕','✨','💜','🌸']);

  if (score === 5) { showResult(ILLUSTS.success5, false); return; }
  if (score === 3) { showResult(ILLUSTS.success3, true);  return; }
  if (score === 1) { showResult(ILLUSTS.success1, true);  return; }

  showComboBadge(`成功 ${score}回目！`);
  scheduleUkeMove();
}

/* ============================================================
   Miss
   ============================================================ */
function onMiss() {
  missCount++;
  failStreak++;
  updateHeartsBar();
  updateStreakBar();

  flashScreen('fail');
  spawnParticles(ukeX, parseInt(ukeEl.style.top), ['💧','😢','💦']);

  if (failStreak >= 5) {
    failStreak = 0;
    updateStreakBar();
    showResult(ILLUSTS.fail5streak, true);
    return;
  }

  if (missCount === 1 && failStreak === 1) {
    showResult(ILLUSTS.fail1, true);
    return;
  }

  if (missCount >= CONFIG.MAX_MISS) {
    showResult({ emoji: '💔', title: 'ゲームオーバー…', sub: 'もう一度挑戦してみて！\n君ならきっとつかまえられる！' }, false);
    return;
  }

  scheduleUkeMove();
}

/* ============================================================
   Result overlay
   ============================================================ */
function showResult(illust, canContinue) {
  gameRunning = false;
  stopWandering();
  clearTimeout(fallTimer);

  resultIllust.innerHTML = illust.emoji;
  resultTitle.textContent = illust.title;
  resultSub.textContent   = illust.sub;

  resultContinue.style.display = canContinue ? 'inline-block' : 'none';
  resultOverlay.classList.add('show');
}

function hideResult() {
  resultOverlay.classList.remove('show');
}

/* ============================================================
   Visual effects
   ============================================================ */
function flashScreen(type) {
  catchFlash.className = '';
  void catchFlash.offsetWidth;
  catchFlash.classList.add(`flash-${type}`);
  setTimeout(() => catchFlash.className = '', 280);
}

function spawnParticles(x, y, emojis) {
  for (let i = 0; i < 7; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    const angle = Math.random() * Math.PI * 2;
    const dist  = 60 + Math.random() * 60;
    p.style.setProperty('--dx', `${Math.cos(angle)*dist}px`);
    p.style.setProperty('--dy', `${Math.sin(angle)*dist}px`);
    p.style.left = (x + CHAR_W/2) + 'px';
    p.style.top  = (y + CHAR_W/2) + 'px';
    gameArea.appendChild(p);
    setTimeout(() => p.remove(), 900);
  }
}

function showComboBadge(text) {
  comboBadge.textContent = text;
  comboBadge.classList.add('show');
  setTimeout(() => comboBadge.classList.remove('show'), 900);
}

/* ============================================================
   Game loop
   ============================================================ */
function gameLoop() {
  if (!gameRunning) return;
  animFrame = requestAnimationFrame(gameLoop);
}

/* ============================================================
   Controls — マウス追従 & タッチスライド
   ============================================================ */
const cursorLine = document.getElementById('cursor-line');

function applySemeFromClientX(clientX) {
  const rect = gameArea.getBoundingClientRect();
  const relX = clientX - rect.left - CHAR_W / 2;
  setSemeX(relX);
  cursorLine.style.left = (semeX + CHAR_W / 2) + 'px';
}

gameArea.addEventListener('mousemove', e => {
  if (!gameRunning) return;
  applySemeFromClientX(e.clientX);
});

gameArea.addEventListener('touchmove', e => {
  if (!gameRunning) return;
  e.preventDefault();
  applySemeFromClientX(e.touches[0].clientX);
}, { passive: false });

gameArea.addEventListener('touchstart', e => {
  if (!gameRunning) return;
  applySemeFromClientX(e.touches[0].clientX);
}, { passive: true });

document.addEventListener('mousemove', e => {
  if (!gameRunning) return;
  applySemeFromClientX(e.clientX);
});

/* ============================================================
   Result buttons
   ============================================================ */
resultContinue.addEventListener('click', () => {
  hideResult();
  gameRunning = true;
  scheduleUkeMove();
  gameLoop();
});

resultRestart.addEventListener('click', () => {
  hideResult();
  initGame();
});

/* ============================================================
   Start / Init
   ============================================================ */
document.getElementById('start-btn').addEventListener('click', () => {
  titleScreen.style.display = 'none';
  gameWrapper.style.display = 'flex';
  initGame();
});

function initGame() {
  score      = 0;
  missCount  = 0;
  failStreak = 0;
  ukeFalling = false;
  stopWandering();

  scoreDisp.textContent = '0';
  buildHeartsBar();
  buildStreakBar();

  ukeEl.innerHTML  = UKE_CHAR;
  semeEl.innerHTML = SEME_CHAR;
  ukeEl.style.top  = '18px';

  setSemeX(areaWidth() / 2 - CHAR_W / 2);
  setUkeX(areaWidth() / 2 - CHAR_W / 2);

  gameRunning = true;
  if (animFrame) cancelAnimationFrame(animFrame);
  gameLoop();

  setTimeout(scheduleUkeMove, 600);
}

</script>
